<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Email Preferences | 318 Food Co.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="section">
    <div class="wrap">
      <section class="card email-preferences-card">
        <p class="kicker">Email preferences</p>
        <h1>Unsubscribe from marketing email</h1>
        <p>Transactional messages about an active quote, proposal, booking, invoice, or payment are managed separately.</p>
        <form id="unsubscribeForm">
          <label><input type="radio" name="scope" value="global" checked> Stop all marketing email</label>
          <label><input type="radio" name="scope" value="campaign"> Stop only this campaign</label>
          <p><button class="btn" type="submit">Confirm Unsubscribe</button></p>
          <p id="unsubscribeMessage" role="status" aria-live="polite"></p>
        </form>
        <p><a href="index.html">Return to 318 Food Co.</a></p>
      </section>
    </div>
  </main>
  <script src="js/unsubscribe.js"></script>
</body>
</html>
