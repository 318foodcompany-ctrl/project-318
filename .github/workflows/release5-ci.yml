name: Release 5 AI Autopilot CI

on:
  push:
    branches:
      - agent/ai-marketing-autopilot
  pull_request:
    branches:
      - agent/final-site-integration

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find api server js tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Complete Node test suite
        run: node --test tests/*.test.js
